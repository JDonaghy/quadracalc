<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- quadracalc app icon: a "quad" of four grid cells on a full-bleed
       tile, one cell picked out as the active cell with a fill handle —
       original geometry, not modelled on any vendor's spreadsheet logo
       (no letters, no "X", no overlapping panels). See README.md for
       the palette and regeneration steps. -->
  <defs>
    <clipPath id="tile">
      <rect x="0" y="0" width="512" height="512" rx="112" ry="112" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile)">
    <rect x="0" y="0" width="512" height="512" fill="#2f6fb0" />
    <!-- Four quadrant cells, 16px gutters, 96px margin. -->
    <rect x="96" y="96" width="152" height="152" rx="18" fill="#f3f6fa" />
    <rect x="264" y="96" width="152" height="152" rx="18" fill="#f3f6fa" />
    <rect x="96" y="264" width="152" height="152" rx="18" fill="#f3f6fa" />
    <!-- Active cell: picked out in the accent colour. -->
    <rect x="264" y="264" width="152" height="152" rx="18" fill="#e8a33d" />
    <!-- Fill handle on the active cell's bottom-right corner. -->
    <rect x="392" y="392" width="28" height="28" rx="6" fill="#10243a" />
  </g>
</svg>
