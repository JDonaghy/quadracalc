[package]
name = "quadracalc-gtk"
description = "quadracalc: GTK4 window"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[bin]]
name = "quadracalc-gtk"
path = "src/main.rs"

[dependencies]
# "control": `GtkRunner::attach_control`, needed for `--mcp` — see
# `quadracalc_core::agent`.
quadraui = { workspace = true, features = ["gtk", "control"] }
quadracalc-core = { workspace = true }
