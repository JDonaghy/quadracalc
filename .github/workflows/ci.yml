name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  linux:
    name: core + tui + gtk (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: GTK4 dev libraries
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude quadracalc-mac --exclude quadracalc-win --all-targets
      - run: cargo test -p quadracalc-core
      - run: cargo build -p quadracalc -p quadracalc-gtk

  macos:
    name: macOS window
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p quadracalc -p quadracalc-mac
      - run: cargo test -p quadracalc-mac

  windows:
    name: Windows window
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p quadracalc -p quadracalc-win
